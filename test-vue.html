<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LX Music</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background-color: #f5f5f5; }
    .app-container { display: flex; height: 100vh; }
    .sidebar { width: 60px; background-color: #e8f5e9; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
    .logo { font-size: 24px; font-weight: bold; color: #4caf50; margin-bottom: 30px; letter-spacing: 2px; }
    .nav-item { width: 40px; height: 40px; margin-bottom: 20px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .nav-item.active { background-color: #c8e6c9; }
    .main-content { flex: 1; display: flex; flex-direction: column; background-color: #fff; }
    .search-bar { padding: 20px; background-color: #f5f5f5; }
    .search-container { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
    .search-input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; }
    .search-btn { padding: 10px 20px; background-color: #4caf50; color: white; border: none; border-radius: 20px; cursor: pointer; }
    .tabs { display: flex; background-color: #f5f5f5; border-bottom: 1px solid #e0e0e0; }
    .tab { padding: 12px 20px; cursor: pointer; border: none; background: none; }
    .tab.active { color: #4caf50; border-bottom: 2px solid #4caf50; }
    .results-container { flex: 1; overflow-y: auto; padding: 20px; }
    .song-item { padding: 12px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-container">
      <div class="sidebar">
        <div class="logo">LX</div>
        <div class="nav-item active">🔍</div>
      </div>
      <div class="main-content">
        <div class="search-bar">
          <div class="search-container">
            <input v-model="searchQuery" @keyup.enter="handleSearch" type="text" placeholder="搜索音乐..." class="search-input">
            <button @click="handleSearch" class="search-btn">搜索</button>
          </div>
        </div>
        <div class="tabs">
          <button :class="['tab', { active: currentTab === 'tx' }]" @click="currentTab = 'tx'">TX Music</button>
          <button :class="['tab', { active: currentTab === 'all' }]" @click="currentTab = 'all'">Aggregated</button>
        </div>
        <div class="results-container">
          <div v-if="isLoading">加载中...</div>
          <div v-else-if="searchResults.length === 0">暂无搜索结果</div>
          <div v-else>
            <div v-for="(song, index) in searchResults" :key="index" class="song-item">
              <span>{{ index + 1 }}. {{ song.name }} - {{ song.singer }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          searchQuery: '',
          currentTab: 'tx',
          searchResults: [],
          isLoading: false
        };
      },
      methods: {
        async handleSearch() {
          console.log('Search triggered!');
          console.log('currentTab:', this.currentTab);
          console.log('searchQuery:', this.searchQuery);
          
          if (!this.searchQuery.trim()) return;
          
          this.isLoading = true;
          this.searchResults = [];
          
          try {
            const source = this.currentTab === 'all' ? 'tx' : this.currentTab;
            const url = `http://localhost:3000/api/music/search?q=${encodeURIComponent(this.searchQuery)}&page=1&limit=100&source=${source}`;
            
            console.log('Request URL:', url);
            
            const response = await fetch(url);
            console.log('Response status:', response.status);
            
            const data = await response.json();
            console.log('Response data:', data);
            console.log('data.list:', data.list);
            console.log('data.list.length:', data.list ? data.list.length : 0);
            
            if (data && data.list) {
              this.searchResults = data.list;
              console.log('Results set:', this.searchResults.length);
            }
          } catch (error) {
            console.error('Error:', error);
          } finally {
            this.isLoading = false;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
