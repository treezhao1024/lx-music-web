<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
</head>
<body>
  <h1>API Test</h1>
  <button onclick="testAPI()">Test API</button>
  <pre id="result"></pre>
  
  <script>
    async function testAPI() {
      const result = document.getElementById('result');
      result.textContent = 'Testing...';
      
      try {
        const url = 'http://localhost:3000/api/music/search?q=%E5%91%A8%E6%9D%B0%E4%BC%9F&page=1&limit=10&source=tx';
        console.log('Request URL:', url);
        
        const response = await fetch(url);
        console.log('Status:', response.status);
        
        const data = await response.json();
        console.log('Data:', data);
        
        result.textContent = 'Status: ' + response.status + '\n' +
                            'Total: ' + data.total + '\n' +
                            'List length: ' + data.list.length + '\n' +
                            'First song: ' + JSON.stringify(data.list[0]);
      } catch (error) {
        result.textContent = 'Error: ' + error.message;
        console.error('Error:', error);
      }
    }
  </script>
</body>
</html>
