<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LX Music</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }
    
    .app-container {
      display: flex;
      height: 100vh;
    }
    
    .sidebar {
      width: 60px;
      background-color: #e8f5e9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }
    
    .nav-item {
      width: 40px;
      height: 40px;
      margin-bottom: 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
      font-size: 20px;
    }
    
    .nav-item:hover, .nav-item.active {
      background-color: #c8e6c9;
      color: #4caf50;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #fff;
    }
    
    .search-bar {
      padding: 20px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .search-container {
      display: flex;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .search-input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .search-input:focus {
      border-color: #4caf50;
    }
    
    .search-btn, .clear-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    
    .search-btn {
      background-color: #4caf50;
      color: white;
    }
    
    .search-btn:hover {
      background-color: #45a049;
    }
    
    .clear-btn {
      background-color: #f0f0f0;
      color: #666;
    }
    
    .clear-btn:hover {
      background-color: #e0e0e0;
    }
    
    .tabs {
      display: flex;
      gap: 0;
      background-color: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      overflow-x: auto;
    }
    
    .tab {
      padding: 12px 20px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      color: #666;
      white-space: nowrap;
      transition: all 0.3s;
      border-bottom: 2px solid transparent;
    }
    
    .tab:hover {
      color: #4caf50;
    }
    
    .tab.active {
      color: #4caf50;
      border-bottom-color: #4caf50;
    }
    
    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .results-header {
      display: grid;
      grid-template-columns: 40px 2fr 1fr 2fr 1fr;
      gap: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 12px;
      color: #666;
    }
    
    .song-item {
      display: grid;
      grid-template-columns: 40px 2fr 1fr 2fr 1fr;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      align-items: center;
    }
    
    .song-item:hover {
      background-color: #f5f5f5;
    }
    
    .song-number {
      color: #999;
      font-size: 14px;
    }
    
    .song-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .song-title {
      font-size: 14px;
      color: #333;
    }
    
    .song-tags {
      display: flex;
      gap: 5px;
    }
    
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    
    .tag-sq {
      background-color: #4caf50;
    }
    
    .tag-kg {
      background-color: #2196f3;
    }
    
    .tag-tx {
      background-color: #ff9800;
    }
    
    .song-artist {
      font-size: 13px;
      color: #666;
    }
    
    .song-album {
      font-size: 13px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .song-duration {
      font-size: 13px;
      color: #999;
      text-align: right;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-container">
      <!-- 侧边栏 -->
      <div class="sidebar">
        <div class="logo">LX</div>
        <div class="nav-item active">🔍</div>
        <div class="nav-item">🎵</div>
        <div class="nav-item">📊</div>
        <div class="nav-item">❤️</div>
        <div class="nav-item">⚙️</div>
      </div>
      
      <!-- 主内容区 -->
      <div class="main-content">
        <!-- 搜索栏 -->
        <div class="search-bar">
          <div class="search-container">
            <input 
              type="text" 
              v-model="searchQuery" 
              @keyup.enter="handleSearch"
              placeholder="搜索音乐..."
              class="search-input"
            >
            <button v-if="searchQuery" @click="clearSearch" class="clear-btn">✕</button>
            <button @click="handleSearch" class="search-btn">🔍</button>
          </div>
        </div>
        
        <!-- 标签页 -->
        <div class="tabs">
          <button 
            v-for="tab in tabs" 
            :key="tab.value"
            @click="switchTab(tab.value)"
            :class="['tab', { active: currentTab === tab.value }]"
          >
            {{ tab.label }}
          </button>
        </div>
        
        <!-- 搜索结果 -->
        <div class="results-container">
          <div v-if="isLoading" class="loading">
            搜索中...
          </div>
          
          <div v-else-if="searchResults.length === 0" class="no-results">
            {{ searchQuery ? '暂无搜索结果' : '请输入关键词搜索音乐' }}
          </div>
          
          <div v-else>
            <div class="results-header">
              <div>#</div>
              <div>Title</div>
              <div>Artist</div>
              <div>Album</div>
              <div>Length</div>
            </div>
            
            <div 
              v-for="(song, index) in paginatedSongs" 
              :key="song.songId"
              class="song-item"
            >
              <div class="song-number">{{ index + 1 }}</div>
              <div class="song-info">
                <span class="song-title">{{ song.name }}</span>
                <div class="song-tags">
                  <span v-if="song.source === 'tx'" class="tag tag-tx">TX</span>
                  <span v-if="song.source === 'kg'" class="tag tag-kg">KG</span>
                  <span v-if="song.typeUrl && song.typeUrl['320k']" class="tag tag-sq">SQ</span>
                </div>
              </div>
              <div class="song-artist">{{ song.singer }}</div>
              <div class="song-album">{{ song.albumName }}</div>
              <div class="song-duration">{{ formatDuration(song.interval) }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/client/main.js"></script>
</body>
</html>
